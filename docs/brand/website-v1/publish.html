function fitAll(){
  var phone = innerWidth <= 760;
  $$('.hp-win').forEach(function(w){ w.classList.toggle('compact', phone); var app = $('.app', w); if (app) app.classList.toggle('rail', phone); });
  $$('.fit').forEach(function(f){
    var c = f.firstElementChild, w = +f.dataset.w;
    if (f.classList.contains('hp-win') && phone) w = 640;
    c.style.width = w + 'px';
    if (f.closest('.hp-bstage') && innerWidth > 1100){ c.style.zoom = 0.86; return; }
    var avail = f.clientWidth;
    c.style.zoom = Math.min(1, avail / w);
  });
}
fitAll(); addEventListener('resize', fitAll);

  var w = $('#hp-wait'); if (w){ w.className = 'wait' + (st >= 2 ? ' done' : ''); w.innerHTML = st >= 2 ? '<span class="st live">Live at ' + s.addr + '</span>' : '<span class="dotload"></span>Waiting for your chat'; }
  if (st === 0) progress(-1, 0);
  if (st === 1) progress(0, 45);
  if (st === 2) progress(0, 100);
  if (st === 3) progress(1, 100);
  if (st === 4) progress(2, 100);
}
window.__heroState = setState;
function runLoop(){
  timers.forEach(clearTimeout); timers = [];
  setState(0);
  at(B.publish, function(){ setState(1); });
  at(B.live, function(){ setState(2); });
  at(B.session, function(){ setState(3); });
  at(B.transcript, function(){ setState(4); });
  at(B.hold, runLoop);
}
var fixed = Q.get('state');
if (fixed !== null) setState(+fixed);
else if (RM) setState(4);
else runLoop();

/* ===================== TRANSCRIPT PLAYBACK (a recorded session playing back; never live) ===================== */
(function(){
  var tr = $('#hp-tr'); if (!tr) return;
  var ws = $$('.w', tr), rows = $$('.row', tr), bars = $$('#hp-trwave i'), tc = $('#hp-trtc');
  var t0 = M.lines[0].s, t1 = 220;
  function show(t){
    var cur = -1;
    ws.forEach(function(el, i){ var said = words[i].s <= t; el.classList.toggle('said', said); if (said) cur = i; });
    ws.forEach(function(el, i){ el.classList.toggle('now', i === cur && t < t1 - 0.5); });
    var li = cur >= 0 ? words[cur].li : -1;
    rows.forEach(function(r, i){ r.classList.toggle('cur', i === li); });
    var f = (t - t0) / (t1 - t0);
    bars.forEach(function(b, i){ b.classList.toggle('p', i / bars.length <= f); });
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    tc.textContent = ('0' + m).slice(-2) + ':' + ('0' + s).slice(-2);
  }
  if (RM || Q.get('still')){ show(188.4); return; }
  var t = t0, running = false;
  function tick(){ if (!running) return; t += 0.12 * 2.4; if (t > t1 + 4) t = t0; show(Math.min(t, t1)); setTimeout(tick, 120); }
  var io = new IntersectionObserver(function(es){ es.forEach(function(e){ var was = running; running = e.isIntersecting; if (running && !was) tick(); }); }, { threshold: 0.3 });
  io.observe(tr); show(t0);
})();
(function(){
  var tl = $('#hp-tl'); if (!tl) return;
  if (RM || Q.get('shoot')){ tl.classList.add('hp-seen'); return; }
  var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ tl.classList.add('hp-seen'); io.disconnect(); } }); }, { threshold: 0.4 });
  io.observe(tl);
})();
})();
