<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // scene.html?v=5|4|shared&s=buttons|nav  (v=4: round 4's files kept in r4/; v=5: this round; v=shared: what Team H gets)
  var Q = new URLSearchParams(location.search), V = Q.get('v') || '5', S = Q.get('s') || 'buttons';
  var BASE = V === '4' ? 'r4/' : V === 'shared' ? '../shared/' : '';
  document.write('<link rel="stylesheet" href="' + BASE + 'aero.css">');
  if (Q.get('rm') === '1') window.GLASS_REDUCED = true;
</script>
<style>
  body.site{margin:0}
  .lab-pad{padding:24px 28px 40px}
  .lab-h{font:500 12px/1.3 var(--mono);color:var(--mut);margin:0 0 10px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .panel{border-radius:22px;padding:26px 24px 22px;position:relative;overflow:hidden;min-height:150px}
  .panel .tag{font:500 11px/1 var(--mono);color:rgba(0,0,0,.45);position:absolute;left:18px;top:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .row .lbl{font:11px/1 var(--mono);color:rgba(0,0,0,.42);width:54px}
  .plain{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
  /* near-colour panel: the hero screen corner and a few real neighbours */
  .near{background:#fff;box-shadow:inset 0 0 0 1px var(--line);min-height:250px}
  .near .scr{position:absolute;right:-40px;top:22px;width:300px;height:210px;border-radius:14px;background:#FF5A36;box-shadow:0 20px 40px -20px rgba(0,0,0,.35)}
  .near .scr i{position:absolute;left:30px;top:40px;width:150px;height:96px;border-radius:12px;background:#fff}
  .near .blue{position:absolute;left:24px;bottom:20px;width:120px;height:56px;border-radius:12px;background:#4F86EA}
  .near .row{position:absolute;left:150px;top:96px;margin:0}
  .near .row2{position:absolute;left:160px;bottom:28px;margin:0}
  /* nav scene: a long page under the nav */
  .pg-hero{margin:12px 0 0;border-radius:32px;padding:64px 56px 40px;min-height:420px}
  .pg-h1{font-weight:430;font-size:64px;line-height:1.02;letter-spacing:-.04em;margin:0 0 18px}
  .pg-scr{margin:40px auto 0;max-width:1000px;height:420px;border-radius:16px;background:#FF5A36;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.4)}
  .pg-scr .bar{position:absolute;left:0;right:0;top:0;height:30px;border-radius:16px 16px 0 0;background:#f1f1f3}
  .pg-scr .card{position:absolute;left:50%;top:90px;transform:translateX(-50%);width:420px;height:240px;border-radius:20px;background:#fff}
  .pg-scr .card b{position:absolute;left:28px;top:90px;font-size:56px;font-weight:600;letter-spacing:-.04em;color:#1D1D1F}
  .pg-txt{max-width:720px;margin:56px auto;font-size:18px;line-height:1.6;color:var(--ink2)}
  .pg-txt h2{font-weight:430;font-size:40px;letter-spacing:-.035em;color:var(--ink);margin:0 0 12px}
  .pg-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:40px 0}
  .pg-cards div{height:220px;border-radius:22px}
  .pg-dark{height:260px;border-radius:22px;background:#111114;color:#fff;padding:40px;font-size:30px;letter-spacing:-.02em;margin:40px 0}
  @media (max-width:820px){.grid{grid-template-columns:1fr}.pg-hero{padding:36px 16px 24px}.pg-h1{font-size:40px}.pg-cards{grid-template-columns:1fr}.lab-pad{padding:16px}}
</style>
</head>
<body class="site">
<div id="root"></div>
<script>
(function () {
  var LOCK = '<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="20 -710 2288.2 722"><path fill="currentColor" d="M20 0 276 -710H413L669 0H554L489 -185H199L135 0ZM233 -283H456L344 -607Z M951 12Q873 12 816.5 -22Q760 -56 729.5 -119Q699 -182 699 -266Q699 -350 729.5 -412.5Q760 -475 816 -509.5Q872 -544 948 -544Q1020 -544 1075 -510.5Q1130 -477 1160.5 -414Q1191 -351 1191 -262V-235H809Q813 -157 850.5 -118Q888 -79 952 -79Q999 -79 1030 -101Q1061 -123 1073 -160L1183 -153Q1162 -79 1100.5 -33.5Q1039 12 951 12ZM809 -315H1079Q1074 -386 1038.5 -420Q1003 -454 948 -454Q891 -454 854.5 -418.5Q818 -383 809 -315Z M1286 0V-532H1383L1387 -391L1378 -394Q1389 -466 1422.5 -499Q1456 -532 1513 -532H1564V-437H1513Q1473 -437 1446 -424Q1419 -411 1405.5 -384Q1392 -357 1392 -314V0Z M1847 12Q1771 12 1714 -22Q1657 -56 1626 -119Q1595 -182 1595 -266Q1595 -351 1626 -413Q1657 -475 1714 -509.5Q1771 -544 1847 -544Q1923 -544 1980 -509.5Q2037 -475 2068 -413Q2099 -351 2099 -266Q2099 -182 2068 -119Q2037 -56 1980 -22Q1923 12 1847 12ZM1847 -80Q1915 -80 1952 -129.5Q1989 -179 1989 -266Q1989 -353 1952 -402.5Q1915 -452 1847 -452Q1780 -452 1742.5 -402.5Q1705 -353 1705 -266Q1705 -179 1742.5 -129.5Q1780 -80 1847 -80Z"/><circle cx="2234.2" cy="-70" r="74" fill="#3478F6"/></svg>';
  var NAV = '<header class="site-nav"><div class="site-wrap site-nav-in"><a class="site-logo" href="#" aria-label="Aero home">' + LOCK + '</a>' +
    '<nav class="site-menu" id="site-menu" aria-label="Main"><a href="#">Features</a><a href="#">Pricing</a><a href="#">Use cases</a><a href="#">Guides</a><a href="#">Blog</a><a class="site-menu-login" href="#">Log in</a></nav>' +
    '<div class="site-nav-r"><a class="btn g3 sm site-login" href="#" data-glass-v3="secondary"><span>Log in</span></a><a class="btn g3 sm" href="#" data-glass-v3="primary" data-fill="rgba(29,29,31,.8)"><span>Start free</span></a>' +
    '<button class="site-burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-menu"><i></i><i></i></button></div></div></header>';
  function pair(size, force, id) {
    var f = force ? ' data-force="' + force + '" data-px=".32" data-py=".3"' : '';
    return '<a class="btn g3 ' + size + '" href="#"' + (id ? ' id="' + id + '-ink"' : '') + ' data-glass-v3="primary" data-fill="rgba(29,29,31,.8)"' + f + '><span>Start free</span></a>' +
      '<a class="btn g3 ' + size + '" href="#"' + (id ? ' id="' + id + '-clear"' : '') + ' data-glass-v3="secondary"' + f + '><span>See pricing</span></a>';
  }
  var root = document.getElementById('root'), h = '';
  if (S === 'buttons') {
    h += '<div class="lab-pad"><div class="grid">';
    [['w-hero', 'Hero wash'], ['w-publish', 'Publish wash'], ['w-test', 'Test wash'], ['w-review', 'Review wash']].forEach(function (w, i) {
      h += '<div class="panel ' + w[0] + '" id="p' + i + '"><span class="tag">' + w[1] + '</span>' +
        '<div class="row"><span class="lbl">rest</span>' + pair('lg', '', 'r' + i) + '</div>' +
        '<div class="row"><span class="lbl">hover</span>' + pair('lg', 'hover', 'h' + i) + '</div>' +
        '<div class="row"><span class="lbl">sm, md</span>' + pair('sm') + pair('md') + '</div></div>';
    });
    h += '<div class="panel near" id="p4"><span class="tag">Next to colour</span><div class="scr"><i></i></div><div class="blue"></div>' +
      '<div class="row">' + pair('lg', '', 'n') + '</div><div class="row2">' + pair('md') + '</div></div>';
    h += '<div class="panel plain" id="p5"><span class="tag">Plain white</span><div class="row"><span class="lbl">rest</span>' + pair('lg', '', 'w') + '</div><div class="row"><span class="lbl">hover</span>' + pair('lg', 'hover') + '</div><div class="row"><span class="lbl">sm, md</span>' + pair('sm') + pair('md') + '</div></div>';
    h += '</div></div>';
  } else {
    h += NAV + '<main><div class="site-wrap">' +
      '<div class="pg-hero w-hero"><h1 class="pg-h1">One prompt and it’s live<span class="hd-dot">.</span><br>One link and it’s tested<span class="hd-dot">.</span></h1>' +
      '<p class="site-lead" style="max-width:34em">Send one test link: people try it on their own computer, and you get the recording, transcript and summary back.</p>' +
      '<div class="pg-scr"><div class="bar"></div><div class="card"><b>£20.00</b></div></div></div>' +
      '<div class="pg-txt"><h2>Publish<span class="hd-dot">.</span></h2><p>Paste one prompt into Claude and the page is live at its own address. Upload HTML or bring a Figma prototype if you prefer. No hosting, no domain settings.</p><p>Every site keeps its versions, can sit behind a password, and can use your own domain.</p></div>' +
      '<div class="pg-cards"><div class="w-publish"></div><div class="w-test"></div><div class="w-review"></div></div>' +
      '<div class="pg-cards"><div style="background:#4F86EA"></div><div style="background:#2FA86A"></div><div style="background:#EE8636"></div></div>' +
      '<div class="pg-dark">Review, in dark mode: playback, transcript and the moments people got stuck.</div>' +
      '<div class="pg-txt"><h2>Test<span class="hd-dot">.</span></h2><p>Share one link. Testers open it in their browser: no software, no account. Their screen and voice are recorded while they try your tasks.</p><p>Sessions come back transcribed, with the friction points marked and a summary across everyone who tried it.</p><p>Plans start free.</p></div>' +
      '<div style="height:1400px"></div></div></main>';
  }
  root.innerHTML = h;
  var s = document.createElement('script'); s.src = BASE + 'glass-v3.js'; document.body.appendChild(s);
  window.GLASS_MODE = 'subtle';
})();
</script>
</body>
</html>
